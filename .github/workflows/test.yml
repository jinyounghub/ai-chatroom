name: Node checks
on:
  push:
    branches: [main, chatgpt-only]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: find . -not -path './.git/*' -type f \( -name '*.mjs' -o -name '*.js' \) -print0 | xargs -0 -r -n1 node --check
      - name: Run offline regression tests
        run: |
          if [ -d test ]; then node --test test/*.test.mjs; fi
      - name: Source snapshot for isolated review
        if: github.ref == 'refs/heads/chatgpt-only'
        uses: actions/upload-artifact@v4
        with:
          name: source-review
          path: |
            .
            !.git
          include-hidden-files: true
          retention-days: 1
